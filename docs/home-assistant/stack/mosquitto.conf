# Mosquitto - nur noetig, falls du den Broker spaeter aktivierst.
# Ablegen unter: /opt/homeassistant/mosquitto/config/mosquitto.conf
#
# Benutzer anlegen (einmalig):
#   docker compose exec mosquitto \
#     mosquitto_passwd -c /mosquitto/config/passwd hass

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_type error
